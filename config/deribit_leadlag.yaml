# Deribit-Reference -> Polymarket Lead-Lag Trading Configuration

trading:
  enabled: true
  dry_run: true
  poll_interval_seconds: 30
  market_refresh_interval_seconds: 600  # Re-discover Polymarket markets every 10 min

deribit:
  base_url: "https://www.deribit.com/api/v2/public"
  currency: "BTC"

signal:
  min_edge_threshold: 0.06          # 6pp min net edge (after fees + conservative prob)
  max_edge_threshold: 0.40          # Skip stale/erroneous
  min_time_to_expiry_hours: 4.0     # Don't trade too close to Polymarket resolution
  max_time_to_expiry_days: 7.0
  min_prob: 0.03                    # Skip deep wing strikes
  max_prob: 0.97                    # Skip deep ITM strikes
  min_deribit_volume_24h: 0.1       # Skip stale options with zero volume
  min_deribit_open_interest: 1.0    # Skip illiquid strikes
  max_iv_spread: 30.0               # Skip if bid/ask IV spread > 30pp
  min_call_spread_usd: 50.0         # Min USD between adjacent calls for digital extraction
  signal_cooldown_seconds: 300      # Don't re-signal same market within 5 min

execution:
  max_order_size_usd: 20.0
  max_total_exposure_usd: 100.0
  polymarket_crypto_fee_rate: 0.072 # Dynamic fee: fee_per_share = rate * p * (1-p)
  state_file: "data/deribit_leadlag_state.json"
